<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["bram","mila","joop","wout","rex","fenna","rik"],"default":"bram"},"size":{"editor":"int","min":40,"max":600,"default":240},"$preview":{"width":320,"height":320}}'>
class Component extends DCLogic {
  renderVals() {
    const k = this.props.kind ?? 'bram';
    const accents = { bram: '#4D7CFF', mila: '#FF5A1F', joop: '#12A37A', wout: '#1F3A5F', rex: '#F2B705', fenna: '#9B5CF6', rik: '#8A93A3' };
    const size = Number(this.props.size ?? 240);
    return { isBram: k === 'bram', isMila: k === 'mila', isJoop: k === 'joop', isWout: k === 'wout', isFenna: k === 'fenna', isRik: k === 'rik', isRex: k === 'rex', accent: accents[k] || '#4D7CFF', px: String(size) };
  }
}
</script>

</html>
